<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLN Key Moments</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <div class="title-row">
    <h1 id="page-title">KEY MOMENTS</h1>
    <select id="session-select" class="session-select" aria-label="Session"></select>
    <div class="title-actions">
      <span id="built-at" class="built-at">Loading</span>
      <button type="button" class="refresh-btn" id="refresh-btn">Refresh now</button>
    </div>
  </div>
  <div id="refresh-status" class="refresh-status"></div>

  <div id="scoreboard" class="scoreboard" hidden></div>

  <!-- .controls exists so the phone breakpoint can sit the collapsed filters
       bar and the sort chips on one line; above 600px it is a plain block. -->
  <div class="controls">
  <div class="filters-card collapsed" id="filters-card">
    <button type="button" class="filters-toggle" id="filters-toggle"
            aria-expanded="false" aria-controls="filters-body">
      <span id="filters-toggle-label">Filters</span>
      <span class="caret" aria-hidden="true">▾</span>
    </button>
    <div class="filters-body" id="filters-body">
    <div class="filter-row">
      <div class="filter-group">
        <label class="group-label">Side <span class="group-hint">needs a Team, Player, League, Rookies or Favorites filter</span></label>
        <div class="chip-row" id="side-chips">
          <button type="button" class="chip active" data-side="all" disabled>All</button>
          <button type="button" class="chip" data-side="for" disabled>For</button>
          <button type="button" class="chip" data-side="against" disabled>Against</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="group-label">Result</label>
        <div class="chip-row" id="result-chips">
          <button type="button" class="chip" data-result="hitting">Hitting</button>
          <button type="button" class="chip" data-result="pitching">Pitching</button>
          <button type="button" class="chip" data-result="hr">HR</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="group-label">League</label>
        <div class="chip-row" id="league-chips">
          <button type="button" class="chip active" data-league="">MLN</button>
          <button type="button" class="chip" data-league="GL">Galactic</button>
          <button type="button" class="chip" data-league="LL">Liberty</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="group-label">Show</label>
        <div class="chip-row" id="toggle-chips">
          <button type="button" class="chip toggle active" data-toggle="keymoments">Key Moments</button>
          <button type="button" class="chip toggle" data-toggle="rookies">Rookies</button>
          <button type="button" class="chip toggle" data-toggle="favorites">Favorites</button>
        </div>
      </div>
    </div>

    <div class="filter-row fields-row">
      <div class="filter-group">
        <label class="group-label">Team</label>
        <select id="team-select"><option value="">All teams</option></select>
      </div>
      <div class="filter-group player-search-group">
        <label class="group-label">Player</label>
        <input type="text" id="player-input" placeholder="Player name" autocomplete="off">
        <div id="player-suggest" class="player-suggest" hidden></div>
      </div>
    </div>

    <div class="filter-row">
      <div class="filter-group wide">
        <label class="group-label">Tags <span class="group-hint">any selected tag matches</span></label>
        <div class="chip-row wrap" id="tag-chips"></div>
      </div>
    </div>

    <div class="filters-footer">
      <div class="count-text" id="count-text">0 key moments</div>
      <div class="footer-actions">
        <button type="button" class="link-btn" id="favorites-btn">☆ Manage favorites</button>
        <button type="button" class="link-btn" id="reset-btn">↻ Reset filters</button>
      </div>
    </div>
    </div>
  </div>

  <div class="sort-bar">
    <div class="sort-chip-row" id="sort-chips">
      <button type="button" class="chip active" data-sort="chrono">Time ↓</button>
      <button type="button" class="chip" data-sort="wpa">WPA</button>
      <button type="button" class="chip" data-sort="leverage"><span class="lbl-long">Leverage</span><span class="lbl-short">Lev</span></button>
    </div>
  </div>
  </div>

  <div id="moments"></div>
  <div id="empty-state" class="empty-state" hidden>No plays match these filters.</div>

</div>

<!-- Favorites panel -->
<div class="modal" id="fav-modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <strong>Favorites</strong>
      <button type="button" class="link-btn" id="fav-close">Close</button>
    </div>
    <div class="modal-body">
      <p class="modal-note" id="fav-note">
        No password, no account - this just remembers the name you type on this device
        and keeps a starred-player list under it. Anyone typing the same name sees the same list.
      </p>
      <div class="name-row">
        <input type="text" id="fav-name" placeholder="Your display name">
        <button type="button" class="chip active" id="fav-save-name">Use this name</button>
      </div>
      <input type="text" id="fav-search" placeholder="Search players" disabled>
      <div id="fav-list" class="fav-list"></div>
      <div id="fav-status" class="fav-status"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/favorites.js"></script>
<script src="js/app.js"></script>
</body>
</html>

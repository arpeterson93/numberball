name: Build Key Moments

# The schedule is a best-effort backstop only - GitHub delays or drops cron
# triggers on low-activity repos. The page's "Refresh now" button fires a
# workflow_dispatch through an Apps Script proxy for an instant rebuild.
on:
  schedule:
    - cron: '17,47 * * * *'   # twice an hour
  workflow_dispatch:

concurrency:
  group: key-moments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No credentials needed: the MLN sheet is read through the public
      # gviz CSV endpoint, same as utils.read_mln_*_from_sheet already does.
      - name: Build key moments JSON
        run: python -u key_moments_build.py

      # meta.json's built_at changes on every run, so committing it
      # unconditionally would mean a commit every half hour. Scheduled runs only
      # publish when the feed itself changed; manual runs (the page's "Refresh
      # now" button) always publish, so built_at advances and the page's poll
      # can tell the rebuild finished.
      - name: Commit refreshed data
        env:
          ALWAYS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet -- docs/data ':!docs/data/meta.json' \
             && [ "$ALWAYS_PUBLISH" != "true" ]; then
            echo "No change to the feed - skipping commit."
            git reset
          else
            git commit -m "Refresh key moments"
            git push
          fi

name: Build Key Moments

# Deploys straight to GitHub Pages via the native Actions flow
# (upload-pages-artifact + deploy-pages) instead of committing generated
# data to git: the build runs fresh in this throwaway workspace and is
# published directly, so main's history never gets bot commits and there's
# nothing for a human commit to conflict with (see key-moments-plan.md).
#
# Requires repo Settings -> Pages -> Build and deployment -> Source set to
# "GitHub Actions" (one-time manual step, not something this file can do).
#
# The schedule is a best-effort backstop only - GitHub delays or drops cron
# triggers on low-activity repos. The page's "Refresh now" button fires a
# workflow_dispatch through an Apps Script proxy for an instant rebuild. The
# push trigger keeps code changes deploying promptly instead of waiting for
# the next scheduled data-only refresh.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'key_moments_build.py'
      - 'career_build.py'
      - 'accomplishments_build.py'
      - 'tools/accomplishment_frequency.py'
      - 'tools/season_milestones.py'
      - 'tools/push_send.py'
      - 'tools/push_icons.py'
      - 'rookie_tags.py'
      - 'requirements.txt'
      - '.github/workflows/key_moments.yml'
  schedule:
    - cron: '17,47 * * * *'   # twice an hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The schedule and the 10-minute dispatch fire whether or not anything changed, and every deploy queues behind the last one
  # (the `pages` group above), so the long ones stack up. This gate hashes the sheet tabs the build reads (a few seconds,
  # standard library only) and skips the build and the deploy when they match the live site's - see tools/should_deploy.py.
  # Pushes always build; so does an hourly heartbeat, so the page's "updated" time never goes stale for long.
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      state: ${{ steps.gate.outputs.state }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/should_deploy.py
          sparse-checkout-cone-mode: false

      - name: Has the sheet changed?
        id: gate
        run: python3 tools/should_deploy.py

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No credentials needed: the MLN sheet is read through the public
      # gviz CSV endpoint, same as utils.read_mln_*_from_sheet already does.
      # Output lands in docs/data/ in this workspace only - never committed.
      - name: Build key moments JSON
        run: python -u key_moments_build.py

      # Career game logs, season totals, session records and the play-search
      # index, derived from the JSON the step above (and the committed
      # archive seasons) already wrote - no network needed. Output is
      # generated here only, like the rest of docs/data.
      - name: Build career, records and search data
        run: python -u career_build.py

      # Single-game feats and season league-leader titles for the player Awards tab: reads the built JSON above and
      # patches "acc" into each player's career file, so it must run after career_build.py.
      - name: Build player accomplishments
        run: python -u accomplishments_build.py

      # Web-push alerts, step 1 of 2: save the still-live previous build as the baseline for "what is new" (see
      # tools/push_send.py). The alerts themselves go out in the notify job below, once the deploy is live, so a tapped
      # alert always finds its play. Needs no secrets and never blocks the deploy.
      # Small square copies of the team logos for the push alerts' icons (tools/push_icons.py)
      - name: Build notification icons
        run: python -u tools/push_icons.py

      - name: Save the live data for the push diff
        continue-on-error: true
        run: python -u tools/push_send.py --snapshot push_baseline

      - name: Keep the baseline for the notify job
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: push-baseline
          path: push_baseline
          if-no-files-found: ignore

      # What the gate compared against next time: the sheet's hash and when this deploy happened (ships with the site)
      - name: Record the build hash
        env:
          STATE: ${{ needs.gate.outputs.state }}
        run: printf '%s' "$STATE" > docs/data/build_hash.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          # v4 dropped dotfiles from the artifact by default; docs/.nojekyll
          # must survive or GitHub Pages may run Jekyll over the site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Web-push alerts, step 2 of 2: after the deploy is live, wait until the site serves this build, then send what is new
  # compared with the baseline saved before the deploy. Does nothing until the PUSH_ENDPOINT / PUSH_SECRET /
  # VAPID_PRIVATE_KEY / VAPID_SUBJECT secrets exist, and a failure here never fails the run.
  notify:
    needs: [gate, build, deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the sender
        uses: actions/checkout@v4
        with:
          sparse-checkout: tools/push_send.py
          sparse-checkout-cone-mode: false

      - name: Get the baseline
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: push-baseline
          path: push_baseline

      - name: Send push notifications
        env:
          PUSH_ENDPOINT: ${{ secrets.PUSH_ENDPOINT }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          STATE: ${{ needs.gate.outputs.state }}
        run: |
          if [ -n "$PUSH_SECRET" ]; then pip install pywebpush; fi
          python3 -u tools/push_send.py --old-base push_baseline --new-base https://mlngameday.com/data --expect-state "$STATE"
